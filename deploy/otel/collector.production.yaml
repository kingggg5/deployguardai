extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: deployguard-api
          scrape_interval: 15s
          metrics_path: /api/v1/metrics
          static_configs:
            - targets: ["${env:DEPLOYGUARD_API_METRICS_TARGET}"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 70
    spike_limit_percentage: 20
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: db.statement
        action: delete
      - key: enduser.id
        action: delete
      - key: user.email
        action: delete
      - key: deployguard.workspace_id
        action: delete
      - key: deployguard.repository_id
        action: delete
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete
  resource/redact:
    attributes:
      - key: process.command_args
        action: delete
      - key: service.instance.id
        action: delete
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlphttp/backend:
    endpoint: "${env:OBSERVABILITY_OTLP_ENDPOINT}"
    headers:
      Authorization: "Bearer ${env:OBSERVABILITY_OTLP_TOKEN}"

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource/redact, batch]
      exporters: [otlphttp/backend]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource/redact, batch]
      exporters: [otlphttp/backend]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource/redact, batch]
      exporters: [otlphttp/backend]
