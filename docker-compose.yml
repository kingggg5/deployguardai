name: deployguard-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deployguard}
      POSTGRES_USER: ${POSTGRES_USER:-deployguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deployguard-dev-only}
    volumes:
      - deployguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-deployguard} -d ${POSTGRES_DB:-deployguard}
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: container
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deployguard}:${POSTGRES_PASSWORD:-deployguard-dev-only}@postgres:5432/${POSTGRES_DB:-deployguard}
      CORS_ORIGINS: http://127.0.0.1:4300,http://localhost:4300
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/v1/health')"
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "4300:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

volumes:
  deployguard-postgres:
