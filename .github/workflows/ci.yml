name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deployguard_ci
          POSTGRES_USER: deployguard
          POSTGRES_PASSWORD: deployguard-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deployguard -d deployguard_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-prod.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q app migrations ../scripts

      - name: Check captured API contracts for drift
        working-directory: backend
        run: python ../scripts/capture_contracts.py --check

      - name: Run backend tests
        working-directory: backend
        env:
          # Use the interpreter installed by setup-python and avoid an
          # extension/plugin injected by the hosted runner changing pytest's
          # command-line behavior.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://deployguard:deployguard-ci-only@localhost:5432/deployguard_ci
        run: >-
          python -m pytest -p pytest_cov --cov=app --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployguard-backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off
          pip-audit -r requirements-prod.txt --progress-spinner off

      - name: Run migrations against a clean SQLite database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic upgrade head

      - name: Check migration head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic current

      - name: Exercise migration chain on PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://deployguard:deployguard-ci-only@localhost:5432/deployguard_ci
        run: |
          alembic upgrade 0007
          alembic upgrade head
          alembic downgrade 0007
          alembic upgrade head
          alembic current

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployguard-frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate local Collector configuration
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}/deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.157.0
          validate --config=/etc/otelcol/config.yaml

      - name: Validate production Collector configuration
        env:
          OBSERVABILITY_OTLP_ENDPOINT: https://telemetry.example
          OBSERVABILITY_OTLP_TOKEN: ci-placeholder
          DEPLOYGUARD_API_METRICS_TARGET: api:8100
        run: >-
          docker run --rm
          --env OBSERVABILITY_OTLP_ENDPOINT
          --env OBSERVABILITY_OTLP_TOKEN
          --env DEPLOYGUARD_API_METRICS_TARGET
          --volume "${{ github.workspace }}/deploy/otel/collector.production.yaml:/etc/otelcol/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.157.0
          validate --config=/etc/otelcol/config.yaml

  evaluation:
    name: Reproducible evidence evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install benchmark test dependencies
        run: python -m pip install --disable-pip-version-check -e "./backend[test]"

      - name: Run engine-backed versioned benchmark
        run: python scripts/evaluate_benchmarks.py --output evaluation-results.json

      - name: Test benchmark contract
        working-directory: backend
        run: python -m pytest tests/test_benchmark_evaluator.py

      - name: Upload evaluation results
        uses: actions/upload-artifact@v6
        with:
          name: deployguard-evaluation
          path: evaluation-results.json
          if-no-files-found: error

  dotnet-spike:
    name: .NET 10 read-only parity spike
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build read-only spike
        run: >-
          dotnet build spikes/dotnet-readonly/DeployGuard.ReadOnlySpike.csproj
          --configuration Release --nologo

      - name: Verify golden and read-contract parity
        run: >-
          dotnet run --project spikes/dotnet-readonly/DeployGuard.ReadOnlySpike.csproj
          --configuration Release --no-build -- --verify --output dotnet-spike-report.json

      - name: Compare same-workload engine benchmark
        run: >-
          python scripts/compare_runtime_benchmarks.py
          --iterations 1000 --repetitions 3
          --output runtime-benchmark-comparison.json

      - name: Upload .NET spike evidence
        uses: actions/upload-artifact@v6
        with:
          name: deployguard-dotnet-spike
          path: |
            dotnet-spike-report.json
            runtime-benchmark-comparison.json
          if-no-files-found: error

  containers:
    name: Build application containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --tag deployguard-ai-api:ci ./backend

      - name: Build web image
        run: docker build --tag deployguard-ai-web:ci ./frontend

      - name: Start the production-shaped Compose runtime
        run: docker compose up --detach --build postgres migrate grant-runtime api worker web

      - name: Smoke test API, web, worker, and runtime RLS role
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8100/api/v1/health/ready
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:4300/
          docker compose exec -T api python -c "import os; assert os.geteuid() != 0"
          docker compose exec -T worker python -c "import os; assert os.geteuid() != 0"
          test "$(docker compose exec -T -e PGPASSWORD=deployguard-app-dev-only postgres \
            psql -U deployguard -d deployguard -Atc \
            "SELECT current_user || ':' || row_security_active('audit_events'::regclass)")" \
            = "deployguard:true"

      - name: Show Compose diagnostics after failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200

      - name: Stop Compose runtime
        if: always()
        run: docker compose down --volumes
