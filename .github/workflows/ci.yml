name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deployguard_ci
          POSTGRES_USER: deployguard
          POSTGRES_PASSWORD: deployguard-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deployguard -d deployguard_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q app migrations ../scripts

      - name: Run backend tests
        working-directory: backend
        env:
          # Use the interpreter installed by setup-python and avoid an
          # extension/plugin injected by the hosted runner changing pytest's
          # command-line behavior.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://deployguard:deployguard-ci-only@localhost:5432/deployguard_ci
        run: python -m pytest

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off

      - name: Run migrations against a clean SQLite database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic upgrade head

      - name: Check migration head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic current

      - name: Exercise migration chain on PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://deployguard:deployguard-ci-only@localhost:5432/deployguard_ci
        run: |
          alembic upgrade 0007
          alembic upgrade head
          alembic downgrade 0007
          alembic upgrade head
          alembic current

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

  evaluation:
    name: Reproducible evidence evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install benchmark test dependencies
        run: python -m pip install --disable-pip-version-check -e "./backend[test]"

      - name: Run engine-backed versioned benchmark
        run: python scripts/evaluate_benchmarks.py --output evaluation-results.json

      - name: Test benchmark contract
        working-directory: backend
        run: python -m pytest tests/test_benchmark_evaluator.py

      - name: Upload evaluation results
        uses: actions/upload-artifact@v6
        with:
          name: deployguard-evaluation
          path: evaluation-results.json
          if-no-files-found: error

  containers:
    name: Build application containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --tag deployguard-ai-api:ci ./backend

      - name: Build web image
        run: docker build --tag deployguard-ai-web:ci ./frontend
