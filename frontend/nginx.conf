limit_req_zone $binary_remote_addr zone=deployguard_api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=deployguard_api_connections:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Metrics are scraped directly from the API over the private service
    # network. Never forward them through the public web ingress.
    location = /api/v1/metrics {
        return 404;
    }

    location /api/ {
        limit_req zone=deployguard_api_per_ip burst=40 nodelay;
        limit_req_status 429;
        limit_conn deployguard_api_connections 30;
        limit_conn_status 429;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace any client-supplied forwarding chain at the trusted ingress.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
