name: DeployGuard Verify
description: Create a deterministic, keyless evidence receipt for a Git change.
author: DeployGuardAI contributors

branding:
  icon: shield
  color: blue

inputs:
  base-sha:
    description: Protected base commit SHA.
    required: true
  head-sha:
    description: Change head commit SHA.
    required: true
  evidence-sha:
    description: Commit SHA that produced the supplied evidence; defaults to head-sha.
    required: false
  junit:
    description: Newline-separated JUnit XML paths or glob patterns.
    required: false
  coverage:
    description: Newline-separated Cobertura XML or LCOV paths or glob patterns.
    required: false
  sarif:
    description: Newline-separated SARIF 2.1.0 paths or glob patterns.
    required: false
  build-status:
    description: "Observed build status: success, failure, or unknown."
    required: false
    default: unknown
  policy-path:
    description: Repository-relative policy path read from the protected base commit.
    required: false
    default: .deployguard/policy.yml
  output:
    description: Repository-relative evidence receipt path.
    required: false
    default: .deployguard/artifacts/evidence-receipt.json
  receipt-ingest-url:
    description: Optional HTTPS DeployGuard receipt endpoint. The URL must include workspace and repository scope.
    required: false
  receipt-ingest-secret:
    description: HMAC secret stored in the caller repository's Actions secrets.
    required: false
  attestation-path:
    description: Optional detached attestation JSON matching the receipt head SHA.
    required: false

outputs:
  decision:
    description: Deterministic pass, review, or block decision.
    value: ${{ steps.verify.outputs.decision }}
  receipt-sha256:
    description: SHA-256 of the canonical evidence receipt body.
    value: ${{ steps.verify.outputs.receipt_sha256 }}
  receipt-path:
    description: Repository-relative receipt path.
    value: ${{ steps.verify.outputs.receipt_path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"

    - name: Install DeployGuard Verify
      shell: bash
      run: >-
        python -m pip install --disable-pip-version-check
        "${GITHUB_ACTION_PATH}/verify"

    - name: Create evidence receipt
      id: verify
      shell: bash
      env:
        INPUT_BASE_SHA: ${{ inputs.base-sha }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        INPUT_EVIDENCE_SHA: ${{ inputs.evidence-sha }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_COVERAGE: ${{ inputs.coverage }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_BUILD_STATUS: ${{ inputs.build-status }}
        INPUT_POLICY_PATH: ${{ inputs.policy-path }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set -uo pipefail
        evidence_sha="${INPUT_EVIDENCE_SHA:-$INPUT_HEAD_SHA}"
        args=(
          verify
          --repository-root "${GITHUB_WORKSPACE}"
          --repository "${GITHUB_REPOSITORY}"
          --base "${INPUT_BASE_SHA}"
          --head "${INPUT_HEAD_SHA}"
          --evidence-sha "${evidence_sha}"
          --policy "${INPUT_POLICY_PATH}"
          --policy-source base
          --build-status "${INPUT_BUILD_STATUS}"
          --output "${INPUT_OUTPUT}"
          --github-summary "${GITHUB_STEP_SUMMARY}"
          --github-output "${GITHUB_OUTPUT}"
        )
        while IFS= read -r pattern; do
          [[ -n "${pattern}" ]] && args+=(--junit "${pattern}")
        done <<< "${INPUT_JUNIT}"
        while IFS= read -r pattern; do
          [[ -n "${pattern}" ]] && args+=(--coverage "${pattern}")
        done <<< "${INPUT_COVERAGE}"
        while IFS= read -r pattern; do
          [[ -n "${pattern}" ]] && args+=(--sarif "${pattern}")
        done <<< "${INPUT_SARIF}"
        # REVIEW/BLOCK are valid verification outcomes. Always leave the
        # receipt behind (and publish it when configured) before returning the
        # deterministic gate status to GitHub Actions.
        set +e
        python -m deployguard_verify.cli "${args[@]}"
        verify_status=$?
        set -e
        printf 'verify_status=%s\n' "${verify_status}" >> "${GITHUB_OUTPUT}"
        exit 0

    - name: Publish authenticated receipt
      if: ${{ always() && inputs.receipt-ingest-url != '' }}
      shell: bash
      env:
        RECEIPT_INGEST_URL: ${{ inputs.receipt-ingest-url }}
        RECEIPT_INGEST_SECRET: ${{ inputs.receipt-ingest-secret }}
        RECEIPT_PATH: ${{ inputs.output }}
        ATTESTATION_PATH: ${{ inputs.attestation-path }}
      run: |
        set -euo pipefail
        [[ -n "${RECEIPT_INGEST_SECRET}" ]] || {
          echo "receipt-ingest-secret is required when receipt-ingest-url is set" >&2
          exit 1
        }
        publish_args=(
          --url "${RECEIPT_INGEST_URL}"
          --secret "${RECEIPT_INGEST_SECRET}"
          --receipt "${GITHUB_WORKSPACE}/${RECEIPT_PATH}"
        )
        if [[ -n "${ATTESTATION_PATH}" ]]; then
          publish_args+=(--attestation "${GITHUB_WORKSPACE}/${ATTESTATION_PATH}")
        fi
        python -m deployguard_verify.publish_receipt "${publish_args[@]}"

    - name: Return verification decision
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        status="${{ steps.verify.outputs.verify_status }}"
        [[ "${status}" =~ ^[0-9]+$ ]] || { echo "verification status was not recorded" >&2; exit 4; }
        exit "${status}"
