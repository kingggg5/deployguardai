[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deployguard-verify"
version = "0.1.0"
description = "Keyless, deterministic evidence receipts for software changes"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=9.0.3,<10",
]

[project.scripts]
deployguard = "deployguard_verify.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["deployguard_verify*"]
